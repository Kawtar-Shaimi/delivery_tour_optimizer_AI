spring:
  application:
    name: delivery-tour-optimizer
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  jpa:
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  ai:
    ollama:
      base-url: ${AI_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_MODEL:tinyllama}

logging:
  level:
    org:
      springframework: INFO

server:
  port: ${SERVER_PORT:8080}

optimizer:
  type: ${OPTIMIZER_TYPE:ai}