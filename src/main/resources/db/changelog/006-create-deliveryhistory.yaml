databaseChangeLog:
  - changeSet:
      id: dto-006-create-delivery-history
      author: Kawtar-Shaimi
      changes:
        - createTable:
            tableName: delivery_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: delivery_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tour_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column: { name: delivery_date, type: DATE }
              - column: { name: planned_time, type: TIME }
              - column: { name: actual_time, type: TIME }
              - column: { name: delay_minutes, type: BIGINT }
              - column: { name: day_of_week, type: VARCHAR(20) }
        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: delivery_id
            referencedTableName: deliveries
            referencedColumnNames: id
            constraintName: fk_history_delivery
        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_history_customer
        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: tour_id
            referencedTableName: tours
            referencedColumnNames: id
            constraintName: fk_history_tour
      rollback:
        - dropTable:
            tableName: delivery_history